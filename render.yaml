services:
  - type: web
    name: sloflix-stremio-addon
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node addon.js
    envVars:
      - key: SLOFLIX_API_URL
        value: https://api.sloflix.com
      # Render injects its own PORT env var automatically - addon.js already
      # reads process.env.PORT, so nothing else to configure here.
